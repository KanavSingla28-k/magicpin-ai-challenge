name: Keep Render Warm
on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes
  workflow_dispatch:  # manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping healthz endpoint
        run: |
          curl -fsS --max-time 30 https://vera-bot-lid1.onrender.com/v1/healthz > /dev/null
          echo "Health check completed at $(date -u)"