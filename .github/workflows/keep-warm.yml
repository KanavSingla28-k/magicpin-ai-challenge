name: Keep Render Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Render health endpoint
        run: |
          URL="https://vera-bot-lid1.onrender.com/v1/healthz"

          for i in {1..6}; do
            echo "Attempt $i..."

            if curl -fsS --max-time 30 "$URL"; then
              echo ""
              echo "Health check successful at $(date -u)"
              exit 0
            fi

            echo "Render not ready. Waiting 20 seconds..."
            sleep 20
          done

          echo "Render health check failed."
          exit 1